services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: hibernate_advanced
      POSTGRES_USER: hibernate
      POSTGRES_PASSWORD: hibernate
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hibernate -d hibernate_advanced"]
      interval: 5s
      timeout: 3s
      retries: 20
